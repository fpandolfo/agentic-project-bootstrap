name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Validate repository context
        run: python tools/context_check.py
      - name: Scan for common privacy and secret leaks
        run: python tools/privacy_scan.py
      - name: Compile
        run: python -m compileall -q src tests tools agentic.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: agentic doctor

  package:
    name: Build and smoke distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install distribution builder
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke distribution consumers
        run: python tools/release_smoke.py --dist-dir dist
      - name: Retain release candidates
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
