name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Validate repository context
        run: python tools/context_check.py
      - name: Scan for common privacy and secret leaks
        run: python tools/privacy_scan.py
      - name: Compile
        run: python -m compileall -q src tests tools agentic.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: agentic doctor
