version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /src/agentic_bootstrap/packs/github/files
    schedule:
      interval: monthly
    groups:
      generated-github-actions:
        patterns: ["*"]
